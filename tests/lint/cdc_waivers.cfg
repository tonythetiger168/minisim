# Crossing waivers for cdc_bad.sv: one crossing by its source and reading
# clock, one rule in a file, and one reset.
waive CDC001 -msg "'cdc_bad.a1' (clocked by cdc_bad.aclk) is read by logic clocked by cdc_bad.bclk*" -reason "a1 is held for four bclk cycles"
waive CDC005 -file "*/cdc_bad.sv" -reason "both copies feed status only"
waive RDC002 -msg "asynchronous reset 'cdc_bad.rst_n' *" -reason "released while both clocks are stopped"
