name: Release

# Push a tag vX.Y.Z (docs/RELEASING.md) to build, test, package, and publish
# a GitHub release. Run it by hand (workflow_dispatch) to build the packages
# as workflow artifacts without publishing anything.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04   # older glibc, so the binaries run on more distros
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image's default mirror (azure.archive.ubuntu.com) and then
      # archive.ubuntu.com itself stopped resolving on the hosted runners, which
      # failed every apt step. Probe a short list of mirrors (packages are
      # signature-checked, so any mirror is safe), point apt at the first one
      # that answers, and make apt fail fast. APT_OK=0 when none answers, so
      # optional installs are skipped instead of holding the job in retries.
      - name: Pick a reachable apt mirror
        run: |
          rel=$(. /etc/os-release && echo "$VERSION_CODENAME")
          pick=
          for m in http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu \
                   https://mirrors.edge.kernel.org/ubuntu https://mirror.us.leaseweb.net/ubuntu \
                   https://ftp.halifax.rwth-aachen.de/ubuntu; do
            if curl -fsS --max-time 10 -o /dev/null "$m/dists/$rel/InRelease"; then pick=$m; break; fi
          done
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          if [ -z "$pick" ]; then
            echo "::warning::no Ubuntu apt mirror is reachable; using preinstalled packages only"
            echo "APT_OK=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "apt mirror: $pick"
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s/\tpriority:1\n' "$pick" | sudo tee /etc/apt/apt-mirrors.txt; fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$f" ]; then sudo sed -i -E "s|https?://azure\.archive\.ubuntu\.com/ubuntu/?|$pick/|g" "$f"; fi
          done
          if sudo timeout 240 apt-get update; then echo "APT_OK=1" >> "$GITHUB_ENV"; else echo "APT_OK=0" >> "$GITHUB_ENV"; fi

      - name: Install g++ 13
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update && sudo apt-get install -y g++-13 zlib1g-dev libffi-dev libssl-dev

      - name: Check the tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want=$(sed -n 's/^project(minisim VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "${GITHUB_REF_NAME#v}" = "$want" || { echo "tag $GITHUB_REF_NAME != CMake version $want"; exit 1; }

      - name: Build and test
        run: |
          CXX=g++-13 cmake -B build -DMINISIM_WITH_SLANG=ON -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j2
          ctest --test-dir build --output-on-failure -E '^icarus/'

      - name: Package
        run: |
          cd build && cpack -G "TGZ;DEB"
          ls -l minisim-*

      - name: Smoke-test the installed package
        run: |
          sudo apt-get install -y ./build/minisim_*.deb
          msim -version
          CXX=g++-13 msim -compile -o /tmp/msim.d examples/cli/adder.sv examples/cli/adder_tb.sv -top adder_tb
          CXX=g++-13 msim -compile -o /tmp/msim.d examples/cli/adder.sv examples/cli/adder_tb.sv -top adder_tb -fst /tmp/a.fst
          test -s /tmp/a.fst
          mregress -version
          mcov -version

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minisim-linux-x86_64
          path: |
            build/minisim-*.tar.gz
            build/minisim_*.deb

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the CHANGELOG section for this version.
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "minisim $v" --notes-file notes.md \
            build/minisim-*.tar.gz build/minisim_*.deb
