name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same mirror probe as in the slang job below. The runner image's default mirror (azure.archive.ubuntu.com) and then
      # archive.ubuntu.com itself stopped resolving on the hosted runners, which
      # failed every apt step. Probe a short list of mirrors (packages are
      # signature-checked, so any mirror is safe), point apt at the first one
      # that answers, and make apt fail fast. APT_OK=0 when none answers, so
      # optional installs are skipped instead of holding the job in retries.
      - name: Pick a reachable apt mirror
        run: |
          rel=$(. /etc/os-release && echo "$VERSION_CODENAME")
          pick=
          for m in http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu \
                   https://mirrors.edge.kernel.org/ubuntu https://mirror.us.leaseweb.net/ubuntu \
                   https://ftp.halifax.rwth-aachen.de/ubuntu; do
            if curl -fsS --max-time 10 -o /dev/null "$m/dists/$rel/InRelease"; then pick=$m; break; fi
          done
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          if [ -z "$pick" ]; then
            echo "::warning::no Ubuntu apt mirror is reachable; using preinstalled packages only"
            echo "APT_OK=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "apt mirror: $pick"
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s/\tpriority:1\n' "$pick" | sudo tee /etc/apt/apt-mirrors.txt; fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$f" ]; then sudo sed -i -E "s|https?://azure\.archive\.ubuntu\.com/ubuntu/?|$pick/|g" "$f"; fi
          done
          if sudo timeout 240 apt-get update; then echo "APT_OK=1" >> "$GITHUB_ENV"; else echo "APT_OK=0" >> "$GITHUB_ENV"; fi

      # mspice's tests compare every measurement with ngspice when it is
      # installed; without a mirror they still check their own expected values.
      - name: Install ngspice
        run: |
          if [ "$APT_OK" = 1 ]; then sudo apt-get install -y ngspice
          else echo "::warning::no apt mirror: mspice tests run without the ngspice comparison"; fi

      - name: Configure, build, and test
        run: CXX=g++ cmake -B build && cmake --build build -j && ctest --test-dir build --output-on-failure

  build-and-test-slang:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image's default mirror (azure.archive.ubuntu.com) and then
      # archive.ubuntu.com itself stopped resolving on the hosted runners, which
      # failed every apt step. Probe a short list of mirrors (packages are
      # signature-checked, so any mirror is safe), point apt at the first one
      # that answers, and make apt fail fast. APT_OK=0 when none answers, so
      # optional installs are skipped instead of holding the job in retries.
      - name: Pick a reachable apt mirror
        run: |
          rel=$(. /etc/os-release && echo "$VERSION_CODENAME")
          pick=
          for m in http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu \
                   https://mirrors.edge.kernel.org/ubuntu https://mirror.us.leaseweb.net/ubuntu \
                   https://ftp.halifax.rwth-aachen.de/ubuntu; do
            if curl -fsS --max-time 10 -o /dev/null "$m/dists/$rel/InRelease"; then pick=$m; break; fi
          done
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          if [ -z "$pick" ]; then
            echo "::warning::no Ubuntu apt mirror is reachable; using preinstalled packages only"
            echo "APT_OK=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "apt mirror: $pick"
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s/\tpriority:1\n' "$pick" | sudo tee /etc/apt/apt-mirrors.txt; fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$f" ]; then sudo sed -i -E "s|https?://azure\.archive\.ubuntu\.com/ubuntu/?|$pick/|g" "$f"; fi
          done
          if sudo timeout 240 apt-get update; then echo "APT_OK=1" >> "$GITHUB_ENV"; else echo "APT_OK=0" >> "$GITHUB_ENV"; fi

      - name: Cache fetched slang sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/_deps
          key: slang-v12.1-${{ hashFiles('CMakeLists.txt') }}-${{ runner.os }}

      # Icarus Verilog 13 cross-checks the tests/spec expectations (icarus/*
      # tests). The distro package is older, so build the v13_0 tag once and cache it.
      - name: Cache Icarus Verilog 13
        id: iv13
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/iverilog13
          key: iverilog-v13_0-${{ runner.os }}

      - name: Build Icarus Verilog 13
        if: steps.iv13.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y gperf flex bison autoconf
          git clone --depth 1 --branch v13_0 https://github.com/steveicarus/iverilog /tmp/iverilog
          cd /tmp/iverilog && sh autoconf.sh && ./configure --prefix=$HOME/iverilog13 && make -j2 && make install

      - name: Put Icarus Verilog 13 on PATH
        run: echo "$HOME/iverilog13/bin" >> "$GITHUB_PATH" && ("$HOME/iverilog13/bin/iverilog" -V 2>&1 || true) | head -1

      # msynth's high-effort compile hands the logic to ABC, run as a separate
      # program (src/synth/abc.hpp). Built from source at a pinned commit,
      # once, and cached. Optional: without it the msynth_*_abc tests use the
      # yosys-abc of the Yosys package below, or are left out.
      - name: Cache ABC
        id: abc
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/abc-bin
          key: abc-bde1659cf7bf-${{ runner.os }}

      - name: Build ABC
        if: steps.abc.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git init -q /tmp/abc && cd /tmp/abc
          git remote add origin https://github.com/berkeley-abc/abc
          git fetch -q --depth 1 origin bde1659cf7bf2b355624c3599cb58e9b6e474f13 && git checkout -q FETCH_HEAD
          make -j2 ABC_USE_NO_READLINE=1 abc
          mkdir -p $HOME/abc-bin && cp abc copyright.txt $HOME/abc-bin/

      - name: Put ABC on PATH
        run: if [ -x "$HOME/abc-bin/abc" ]; then echo "$HOME/abc-bin" >> "$GITHUB_PATH"; "$HOME/abc-bin/abc" -q "version" || true; fi

      - name: Install zlib (FST waveforms)
        run: dpkg -s zlib1g-dev libssl-dev openssl >/dev/null 2>&1 || sudo apt-get install -y zlib1g-dev libssl-dev openssl

      # mfpga's netlists are proven against the RTL with Yosys and placed and
      # routed with nextpnr (tests/fpga/run_test.py skips what is not installed).
      - name: Install Yosys and nextpnr (mfpga tests)
        if: env.APT_OK == '1'
        continue-on-error: true   # optional: a mirror problem must not fail CI
        run: sudo timeout 420 apt-get install -y yosys nextpnr-ice40 nextpnr-ecp5

      # The UVM tests (tests/uvm) run against the Accellera UVM library.
      - name: Fetch Accellera UVM (uvm-core 2020.3.1)
        run: git clone --depth 1 --branch 2020.3.1 https://github.com/accellera-official/uvm-core $HOME/uvm-core

      # memu's test also runs its output through Yosys when there is one.
      - name: Install Yosys (optional)
        run: |
          pip install --user yowasp-yosys && echo "$HOME/.local/bin" >> "$GITHUB_PATH" || true
          pip install --user mtkahypar || true

      # Unbounded -j was SIGTERM'd (exit 143) mid-compile on the hosted runner.
      - name: Configure, build, and test with slang
        run: (dpkg -s libffi-dev >/dev/null 2>&1 || sudo apt-get install -y libffi-dev) && CXX=g++ cmake -B build -DMINISIM_WITH_SLANG=ON -DUVM_HOME=$HOME/uvm-core && cmake --build build -j2 && ctest --test-dir build --output-on-failure
