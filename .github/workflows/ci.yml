name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure, build, and test
        run: CXX=g++ cmake -B build && cmake --build build -j && ctest --test-dir build --output-on-failure

  build-and-test-slang:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched slang sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/_deps
          key: slang-v12.1-${{ hashFiles('CMakeLists.txt') }}-${{ runner.os }}

      # Unbounded -j was SIGTERM'd (exit 143) mid-compile on the hosted runner.
      - name: Configure, build, and test with slang
        run: CXX=g++ cmake -B build -DMINISIM_WITH_SLANG=ON && cmake --build build -j2 && ctest --test-dir build --output-on-failure
